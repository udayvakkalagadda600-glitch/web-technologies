<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body{
            text-align: center;
            padding-top: 200px;
        }
        img{
            width: 100vw;
            height: 100px;
            index=1;
        }
        h2{
            margin-bottom: 40px;
            margin-top: 10px;
        }
        login{
            background-color: teal;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div> 
        <form action="https://www.netflix.com/browse">
            <h2>Welcome to login Page</h2>
            <label for="mail">Email</label>
            <input type="email" class="mail" id="mail" place holder="Enter Mail">
            <br><br>
            <label for="user">Username</label>
            <input type="text" class="user" place holder="Enter Username">
            <br><br>
            <label for="Pass">Password</label>
            <input type="Password" class="Pass" id="Pass">
            <br><br>
            <input type="checkbox" class="Remember">
            <label for="Remember">remember me</label>
            <br><br>
            <input type="Submit" value="Submit" class="Submit">
            <input type="Reset" type="Reset" value="Reset">
     </div>
     </form>
</body>
</html>
