<!DOCTYPE html>
<html>
    <head>
        <title>Canvas 2D Shapes</title>
    </head>
    <style>
        canvas
        {
            width: 80%;
            margin-left: 10%;
        }
    </style>
    <body>
        <h2>Canvas Drawing Example</h2>
        <canvas id="myCanvas" width="1000" height="400"></canvas>
        <script>
            var canvas = document.getElementById("myCanvas");
            var ctx = canvas.getContext("2d");

            // Rectangle
            ctx.fillStyle = "black";
            ctx.fillRect(50, 50, 100, 60);

            // Circle
            ctx.beginPath();
            ctx.arc(250, 80, 40, 0, 2 * Math.PI);
            ctx.fillStyle = "skyblue";
            ctx.fill();

            // Line
            ctx.beginPath();
            ctx.moveTo(50, 150);
            ctx.lineTo(200, 150);
            ctx.strokeStyle = "red";
            ctx.lineWidth = 4;
            ctx.stroke();

            // Triangle
            ctx.beginPath();
            ctx.moveTo(300, 200);
            ctx.lineTo(350, 120);
            ctx.lineTo(400, 200);
            ctx.closePath();
            ctx.fillStyle = "blue";
            ctx.fill();

            // Text
            ctx.fillStyle = "black";
            ctx.font = "20px Arial";
            ctx.fillText("Canvas 2D Shapes", 150, 250);
        </script>

    </body>
</html>
